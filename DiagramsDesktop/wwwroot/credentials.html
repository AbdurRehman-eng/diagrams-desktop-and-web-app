<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credentials Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/credentials.css">
</head>
<body>
  <div id="credentials-root">
    
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <!-- Shield lock icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="2"/>
          <path d="M12 13v3"/>
        </svg>
        <span>GML Credentials</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item active" id="tab-aws" onclick="CredentialsUI.selectTab('AWS')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/></svg>
          AWS
        </li>
        <li class="menu-item" id="tab-azure" onclick="CredentialsUI.selectTab('Azure')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          Microsoft Azure
        </li>
        <li class="menu-item" id="tab-gcp" onclick="CredentialsUI.selectTab('GCP')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v12M6 12h12"/></svg>
          Google Cloud
        </li>
        <li class="menu-item" id="tab-vmware" onclick="CredentialsUI.selectTab('VMwareVCenter')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
          VMware vCenter
        </li>
      </ul>
    </aside>

    <!-- Right Panels Area -->
    <main class="main-content">
      
      <!-- List View Panel -->
      <div id="panel-list">
        <div class="section-header">
          <h1 id="list-title">AWS Credentials</h1>
          <button class="btn btn-primary" onclick="CredentialsUI.showAddForm()">
            <!-- Plus Icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Credential
          </button>
        </div>

        <div class="credential-list-wrapper">
          <table class="credential-table" id="credential-table">
            <thead>
              <!-- Dynamic Headers Loaded via JS -->
            </thead>
            <tbody id="credential-table-body">
              <!-- Loaded via JS -->
            </tbody>
          </table>
          <div id="empty-state" class="empty-state hidden">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
              <line x1="9" y1="18" x2="13" y2="18"/>
            </svg>
            <h3>No Credentials Configured</h3>
            <p>Get started by clicking the "Add Credential" button to save details securely.</p>
          </div>
        </div>
      </div>

      <!-- Add/Edit Form Panel -->
      <div id="panel-form" class="hidden">
        <div class="section-header">
          <h1 id="form-title">Add AWS Credential</h1>
          <button class="btn btn-secondary" onclick="CredentialsUI.hideForm()">Back to List</button>
        </div>

        <div class="form-panel">
          <form id="credential-form" onsubmit="CredentialsUI.handleFormSubmit(event)">
            <input type="hidden" id="form-field-id" />
            
            <div class="form-group">
              <label for="form-field-desc">Description</label>
              <input type="text" id="form-field-desc" class="form-control" placeholder="e.g. Production AWS Credentials" required />
            </div>

            <!-- AWS, Azure, GCP, VMware Dynamic Input Groups -->
            <div id="dynamic-form-fields">
              <!-- Loaded via JS -->
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="CredentialsUI.hideForm()">Cancel</button>
              <button type="submit" class="btn btn-primary" id="btn-form-save">Save Credential</button>
            </div>
          </form>
        </div>
      </div>

    </main>

  </div>

  <script src="js/credentials.js"></script>
</body>
</html>
