<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- A central bold connection network visible even at tiny scales -->
  <!-- Connection lines with thick strokes -->
  <path d="M 228,128 L 128,308 L 328,308 Z" fill="none" stroke="#475569" stroke-width="28" stroke-linejoin="round" />
  
  <!-- Top Node (Cyan) -->
  <circle cx="228" cy="128" r="56" fill="#38BDF8" />
  <circle cx="228" cy="128" r="22" fill="#FFFFFF" />

  <!-- Bottom-Left Node (Indigo) -->
  <circle cx="128" cy="308" r="56" fill="#6366F1" />
  <circle cx="128" cy="308" r="22" fill="#FFFFFF" />

  <!-- Bottom-Right Node (Emerald) -->
  <circle cx="328" cy="308" r="56" fill="#10B981" />
  <circle cx="328" cy="308" r="22" fill="#FFFFFF" />
</svg>