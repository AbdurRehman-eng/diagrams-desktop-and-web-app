<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer container shape representing a Region/VPC -->
  <rect x="68" y="68" width="320" height="320" rx="36" ry="36" 
        fill="url(#containerGrad)" stroke="#38bdf8" stroke-width="10" stroke-dasharray="16 12" filter="url(#shadow)" />

  <!-- A small tag/label icon on the top-left of the container -->
  <rect x="100" y="50" width="100" height="36" rx="10" ry="10" fill="#38bdf8" />
  <rect x="120" y="62" width="60" height="12" rx="6" ry="6" fill="#0f172a" />

  <!-- Dotted Connection Line -->
  <path d="M 180,180 C 230,180 220,280 270,280" 
        fill="none" stroke="#94a3b8" stroke-width="8" stroke-dasharray="12 8" stroke-linecap="round" />

  <!-- Node 1 (Source) -->
  <g filter="url(#shadow)">
    <rect x="110" y="130" width="100" height="100" rx="20" ry="20" fill="url(#grad1)" />
    <!-- Node 1 Icon detail (a mini server/network symbol) -->
    <circle cx="160" cy="180" r="18" fill="none" stroke="#ffffff" stroke-width="6" />
    <circle cx="160" cy="180" r="6" fill="#ffffff" />
  </g>

  <!-- Node 2 (Destination) -->
  <g filter="url(#shadow)">
    <rect x="246" y="230" width="100" height="100" rx="20" ry="20" fill="url(#grad2)" />
    <!-- Node 2 Icon detail (a mini database/storage cylinder symbol) -->
    <path d="M 281,265 C 281,259 311,259 311,265 M 281,265 L 281,295 C 281,301 311,301 311,295 L 311,265 M 281,280 C 281,286 311,286 311,280" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>